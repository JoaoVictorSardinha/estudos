version: "3.9"

services:

  mysql-server:
    image: mysql:8.0
    container_name: mysql-server
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_bin
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_pwd"
      MYSQL_ROOT_PASSWORD: "root_pwd"
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - zabbix-net
    restart: unless-stopped

  zabbix-server-mysql:
    image: zabbix/zabbix-server-mysql:7.4.5-ubuntu
    container_name: zabbix-server-mysql
    environment:
      DB_SERVER_HOST: "mysql-server"
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_pwd"
      MYSQL_ROOT_PASSWORD: "root_pwd"
    ports:
      - "10051:10051"
    networks:
      - zabbix-net
    depends_on:
      - mysql-server
    restart: unless-stopped

  zabbix-web-nginx-mysql:
    image: zabbix/zabbix-web-nginx-mysql:7.4.5-ubuntu
    container_name: zabbix-web-nginx-mysql
    environment:
      ZBX_SERVER_HOST: "zabbix-server-mysql"
      DB_SERVER_HOST: "mysql-server"
      MYSQL_DATABASE: "zabbix"
      MYSQL_USER: "zabbix"
      MYSQL_PASSWORD: "zabbix_pwd"
      MYSQL_ROOT_PASSWORD: "root_pwd"
    ports:
      - "8081:8080"
    networks:
      - zabbix-net
    depends_on:
      - mysql-server
      - zabbix-server-mysql
    restart: unless-stopped

networks:
   zabbix-net:
    external: true

